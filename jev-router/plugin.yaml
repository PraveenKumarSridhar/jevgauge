name: jev-router
version: 0.1.0
description: Session-scoped Desktop model and reasoning router using TypeSafe Jev.
provides_hooks:
  - select_session_runtime
config_schema:
  enabled:
    type: bool
    default: false
    description: Route new eligible Desktop chats through Jev.
  api_key:
    type: secret
    env: TYPESAFE_API_KEY
    description: TypeSafe API key. Only the first bounded message is sent.
  api_url:
    type: str
    default: https://api.typesafe.ai/v1/systemone
  jev_model:
    type: str
    default: jev-latest
  effort_mode:
    type: str
    default: auto
    description: auto lets Jev choose effort; manual keeps the profile or session effort.
  tier_models:
    type: dict
    description: Ordered eligible model ids for economical, balanced, and strongest tiers.
  selection_timeout:
    type: float
    default: 5.0
    description: Overall routing deadline in seconds (0.01 to 10). Defaults retained on expiry.
