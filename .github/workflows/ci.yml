name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[test]'
      - run: python -m pytest
      - run: python -m build
      - name: Inspect the wheel
        run: python scripts/check_wheel.py
  hermes:
    name: Pinned Hermes lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: jevgauge
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: NousResearch/hermes-agent
          ref: d0288be5b3330d2442e3907185b8e9d0958297bb
          path: hermes
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Apply explicit integration
        working-directory: hermes
        run: |
          git apply --check ../jevgauge/integration/hermes-runtime-selection.patch
          git apply ../jevgauge/integration/hermes-runtime-selection.patch
          git apply -C1 --check ../jevgauge/integration/hermes-runtime-drift.patch
          git apply -C1 ../jevgauge/integration/hermes-runtime-drift.patch
      - name: Hermes canonical lifecycle tests
        working-directory: hermes
        run: >-
          scripts/run_tests.sh
          tests/tui_gateway/test_first_prompt_route_hook.py
          tests/tui_gateway/test_route_manual_switch.py
          tests/agent/test_first_session_route_fallback.py
          tests/agent/test_provider_attempt_evidence.py
          tests/agent/test_codex_first_event_timing.py
          tests/tui_gateway/test_model_switch_reasoning_flag.py
          tests/tui_gateway/test_reasoning_session_scope.py
          tests/tui_gateway/test_deferred_model_switch_confirm.py
          tests/tui_gateway/test_make_agent_provider.py
          tests/tui_gateway/contracts/test_generated.py
      - name: Build and smoke the installed wheel
        working-directory: jevgauge
        run: |
          python -m pip install '.[test]'
          python -m build
          python scripts/smoke_install.py --wheel dist/jevgauge-0.1.0-py3-none-any.whl --hermes-repo ../hermes
      - name: Installed dashboard command and cold-resume evidence
        working-directory: hermes
        run: |
          jevgauge_dashboard_python="$(command -v python)"
          source ./activate --
          "$__HERMES_TEST_PYTHON" ../jevgauge/scripts/verify_hermes_dashboard.py --hermes-repo "$PWD" --dashboard-python "$jevgauge_dashboard_python"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Desktop route display regressions
        working-directory: hermes
        run: |
          npm ci
          npm run test:ui --workspace hermes -- src/app/chat/session-route-panel.test.tsx src/app/session/hooks/use-message-stream/utils.test.ts
  dashboard-browser:
    name: V5 browser flows and captured-evidence pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: python -m pip install '.[test]'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          PLAYWRIGHT_CHANNEL: chromium
          JEVGAUGE_PYTHON: python

  compatibility-config:
    name: Read compatibility configuration
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.config.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: config
        run: |
          python - <<'PYCONFIG'
          import os, subprocess
          matrix = subprocess.check_output(['python', 'scripts/check_hermes_update.py', '--matrix'], text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + matrix + '\n')
          PYCONFIG

  native-routing:
    name: Native routing / ${{ matrix.name }}
    needs: compatibility-config
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.compatibility-config.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: jevgauge
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ matrix.ref }}
          path: hermes
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Native plugin consistency and identity regressions
        working-directory: jevgauge
        run: |
          python scripts/build_desktop.py --check
          node --test tests/desktop/*.test.mjs
      - name: Prepare independent CI test dependencies
        id: environment
        working-directory: hermes
        run: |
          source ./activate --
          printf 'python=%s\n' "$__HERMES_TEST_PYTHON" >> "$GITHUB_OUTPUT"
      - name: Verify candidate using shared compatibility configuration
        working-directory: jevgauge
        env:
          CANDIDATE_TEST_PYTHON: ${{ steps.environment.outputs.python }}
        run: >-
          python scripts/check_hermes_update.py
          --hermes-repo ../hermes
          --ref HEAD
          --test-python "$CANDIDATE_TEST_PYTHON"
          --output-dir ../compatibility-evidence
      - name: Report candidate evidence
        if: always()
        run: |
          python - <<'PYREPORT'
          from pathlib import Path
          for receipt in Path('compatibility-evidence').glob('*/receipt.json'):
              print(receipt.read_text())
              print(receipt.with_name('check.log').read_text())
          PYREPORT
