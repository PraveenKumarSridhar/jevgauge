[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jevgauge"
version = "0.1.0"
description = "Choose a Hermes conversation's model and reasoning effort once, with Jev."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Praveen Kumar"}]
dependencies = ["PyYAML>=6.0.2,<7", "tzdata>=2025.1"]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "build>=1.2,<2"]

[project.scripts]
jevgauge = "jevgauge.cli:main"

[project.urls]
Repository = "https://github.com/PraveenKumarSridhar/jevgauge"
Issues = "https://github.com/PraveenKumarSridhar/jevgauge/issues"

[tool.setuptools]
packages = ["jevgauge", "jevgauge.static", "jev_router", "jev_router.desktop"]
package-dir = {jevgauge = "src/jevgauge", jev_router = "jev-router"}

[tool.setuptools.package-data]
jev_router = ["plugin.yaml", "desktop/plugin.js"]
jevgauge = ["pricing.json", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
